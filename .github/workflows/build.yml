name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"
      - name: Build APK
        run: gradle assembleDebug --no-daemon
      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk SolitaireBot.apk
      - uses: actions/upload-artifact@v4
        with:
          name: SolitaireBot.apk
          path: SolitaireBot.apk
          if-no-files-found: error
          retention-days: 30
      - name: Publish latest APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: SolitaireBot (latest)
          files: SolitaireBot.apk
